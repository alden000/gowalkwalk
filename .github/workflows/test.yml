name: Tests

# The end-to-end test drives a real browser against the app with every outbound
# call stubbed, so it needs a Chromium and nothing else. Nothing here reaches
# OpenStreetMap, the weather services or the tile servers.

on:
  push:
    branches:
      - claude/gpx-kml-route-upload-30ojt8
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the test dependencies
        run: npm --prefix test install --no-audit --no-fund

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Run the end-to-end test
        run: node test/e2e.js
