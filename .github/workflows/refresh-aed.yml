name: Refresh the official Singapore data

# Two registers, published on data.gov.sg irregularly: SCDF's defibrillators
# (roughly once a year, in practice) and NParks' reserve amenities (which moved
# five days before this was written). The check runs daily anyway, because the
# cost of asking is a few hundred bytes of metadata each and the cost of being
# a year stale is a walker sent to a defibrillator that has moved.
#
# Only a genuine change downloads a register and commits the rebuilt file; an
# unchanged day touches nothing at all. The commit lands on the working branch,
# where the Pages workflow deploys it and the test workflow checks it, exactly
# as a human push would.

on:
  schedule:
    # 04:30 Singapore time, which is a quiet hour for both the runner fleet and
    # anyone who might be walking.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-aed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          ref: claude/gpx-kml-route-upload-30ojt8

      - name: Rebuild the SCDF defibrillator register if it changed
        run: python3 tools/fetch_aed.py --if-changed

      - name: Rebuild the NParks amenity register if it changed
        run: python3 tools/fetch_nparks.py --if-changed

      - name: Commit whatever changed
        run: |
          if git diff --quiet -- data/; then
            echo "no change to either register"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          aed = json.load(open('data/aed-sg.json'))
          park = json.load(open('data/nparks-sg.json'))
          print(f"SCDF {aed['sourceUpdatedAt'][:10]}: {len(aed['aed']):,} AEDs. "
                f"NParks {park['sourceUpdatedAt'][:10]}: {len(park['places'])} amenities, "
                f"{len(park['landmarks'])} landmarks.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh the official Singapore registers

          Rebuilt by .github/workflows/refresh-aed.yml from the copies SCDF and
          NParks publish on data.gov.sg. Data only; no code changed."
          git push
